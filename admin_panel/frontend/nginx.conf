server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vue SPA statik assets (JS/CSS) — önce dosya sistemi
    location /assets/ {
        try_files $uri @frappe_assets;
    }

    location @frappe_assets {
        proxy_pass http://backend:8000;
        proxy_set_header Host tradehub.localhost;
    }

    # Frappe API proxy
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host tradehub.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Socket.IO WebSocket proxy
    location /socket.io/ {
        proxy_pass http://websocket:9000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Vue SPA — tüm route'ları index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }
}
